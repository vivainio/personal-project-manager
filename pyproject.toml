[project]
name = "ppm"
version = "0.1.0"
description = "Personal project manager"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pyyaml>=6.0.3",
]

[project.scripts]
ppm = "ppm.cli:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

[tool.ruff.format]
quote-style = "double"
